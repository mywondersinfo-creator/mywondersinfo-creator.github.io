<!doctype html>
<html><head><meta charset="utf-8"><title>forms</title><meta name="robots" content="noindex"></head><body>
<!-- Netlify detects this form at deploy time; the app posts problem reports to it -->
<form name="bug" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
<input name="kind"><input name="area"><textarea name="message"></textarea><input name="email"><input name="lang"><input name="version"><input name="device">
<input type="file" name="screenshot"><input name="bot-field">
</form>
</body></html>
