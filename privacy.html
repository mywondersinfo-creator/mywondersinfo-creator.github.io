<script>
const D={"en": {"menu": "Privacy", "title": "Privacy Policy", "upd": "Last updated: 17 October 2026", "intro": "My Wonders is a personal gratitude journal. It is built so that your entries stay with you: the app does not collect personal data. The only thing that can leave your device is a problem report that you decide to send.", "s": [["What we collect", "Nothing on its own. The app has no account, no analytics, no advertising and no tracking, and your entries never leave your device. It works fully offline."], ["Problem reports", "If you send a report from Settings → Report a problem, we receive only what you send: the type of report and the section, your text, a screenshot if you attach one and your email if you enter it, together with the app language, version and phone model (screen size and browser details). Reports reach us through the form services Google Apps Script (Gmail) and are used only to reply to you and improve the app. To have a report deleted, write to mywondersinfo@gmail.com."], ["What stays on your device", "Your entries, the photos you attach, your settings and, if you set one, your password are stored only in the app’s local storage on your device. The password is kept only as a protected hash, never as plain text. The app opens your photo library only when you choose a photo yourself."], ["Sharing and backups", "When you share a card, a film or a collage, or save a backup file, you do it yourself through your device’s standard share or save tools. The app sends nothing on its own. A backup file contains your entries and photos — keep it in a safe place."], ["Deleting your data", "Deleting the app or clearing its data removes all entries from your device. We have no copy and cannot restore them, so save a backup first if you need one."], ["Children", "The app is suitable for all ages. It collects no data on its own; a problem report is sent only when the person writes it and taps Send."], ["Changes", "If this policy changes, the new version will be published on this page with a new date."], ["Contact", "Questions about privacy: mywondersinfo@gmail.com"]], "app": "My Wonders"}, "ru": {"menu": "Конфиденциальность", "title": "Политика конфиденциальности", "upd": "Обновлено: 17 октября 2026", "intro": "«Мои чудеса» — личный дневник благодарности. Приложение устроено так, что твои записи остаются только у тебя: оно не собирает личные данные. С устройства может уйти только сообщение о проблеме, которое ты сама решишь отправить.", "s": [["Что мы собираем", "Ничего само по себе. В приложении нет аккаунта, аналитики, рекламы и отслеживания, а твои записи никогда не покидают устройство. Оно полностью работает без интернета."], ["Сообщения о проблемах", "Если ты отправляешь сообщение через Настройки → «Сообщить о проблеме», мы получаем только то, что ты отправила: тип сообщения и раздел, твой текст, скриншот, если ты его приложила, и email, если ты его указала, а также язык, версию приложения и модель телефона (размер экрана и данные браузера). Сообщения приходят к нам через сервисы форм Google Apps Script (Gmail) и используются только для ответа тебе и улучшения приложения. Чтобы удалить своё сообщение, напиши на mywondersinfo@gmail.com."], ["Что хранится на твоём устройстве", "Записи, прикреплённые фото, настройки и пароль, если ты его установишь, хранятся только в локальном хранилище приложения на твоём устройстве. Пароль хранится только в виде защищённого хеша, а не открытым текстом. Приложение открывает галерею, только когда ты сама выбираешь фото."], ["Поделиться и резервная копия", "Когда ты делишься карточкой, фильмом или коллажем или сохраняешь резервную копию, ты делаешь это сама через стандартные средства устройства. Само приложение ничего не отправляет. Файл резервной копии содержит твои записи и фото — храни его в надёжном месте."], ["Удаление данных", "Если удалить приложение или очистить его данные, все записи исчезнут с устройства. У нас нет копии, и восстановить записи мы не можем, поэтому при необходимости заранее сохрани резервную копию."], ["Дети", "Приложение подходит для любого возраста. Само оно не собирает данных; сообщение о проблеме отправляется, только если человек сам его написал и нажал «Отправить»."], ["Изменения", "Если политика изменится, новая версия будет опубликована на этой странице с новой датой."], ["Контакты", "Вопросы о конфиденциальности: mywondersinfo@gmail.com"]], "app": "Мои чудеса"}, "fr": {"menu": "Confidentialité", "title": "Politique de confidentialité", "upd": "Dernière mise à jour : 17 octobre 2026", "intro": "Mes merveilles est un carnet de gratitude personnel. Il est conçu pour que tes entrées restent à toi : l’application ne collecte aucune donnée personnelle. La seule chose qui peut quitter ton appareil est un signalement de problème que tu choisis d’envoyer.", "s": [["Ce que nous collectons", "Rien d’elle-même. L’application n’a ni compte, ni statistiques, ni publicité, ni suivi, et tes entrées ne quittent jamais ton appareil. Elle fonctionne entièrement hors ligne."], ["Signalements de problème", "Si tu envoies un signalement depuis Réglages → Signaler un problème, nous recevons uniquement ce que tu envoies : le type et la rubrique, ton texte, une capture d’écran si tu en joins une et ton e-mail si tu l’indiques, ainsi que la langue, la version de l’appli et le modèle du téléphone (taille d’écran et informations du navigateur). Les signalements nous parviennent via les services de formulaires Google Apps Script (Gmail) et servent uniquement à te répondre et à améliorer l’application. Pour faire supprimer un signalement, écris à mywondersinfo@gmail.com."], ["Ce qui reste sur ton appareil", "Tes notes, les photos que tu ajoutes, tes réglages et, si tu en définis un, ton mot de passe sont stockés uniquement dans l’espace local de l’application sur ton appareil. Le mot de passe n’est conservé que sous forme d’empreinte protégée, jamais en clair. L’application n’ouvre ta galerie que lorsque tu choisis toi-même une photo."], ["Partage et sauvegardes", "Quand tu partages une carte, un film ou un collage, ou que tu enregistres une sauvegarde, tu le fais toi-même avec les outils standard de ton appareil. L’application n’envoie rien d’elle-même. Un fichier de sauvegarde contient tes notes et tes photos : garde-le en lieu sûr."], ["Supprimer tes données", "Supprimer l’application ou effacer ses données efface toutes les notes de ton appareil. Nous n’en avons aucune copie et ne pouvons pas les restaurer : fais d’abord une sauvegarde si besoin."], ["Enfants", "L’application convient à tous les âges. Elle ne collecte aucune donnée d’elle-même ; un signalement n’est envoyé que si la personne l’écrit et touche Envoyer."], ["Modifications", "Si cette politique change, la nouvelle version sera publiée sur cette page avec une nouvelle date."], ["Contact", "Questions sur la confidentialité : mywondersinfo@gmail.com"]], "app": "Mes merveilles"}, "es": {"menu": "Privacidad", "title": "Política de privacidad", "upd": "Última actualización: 17 de octubre de 2026", "intro": "Mis maravillas es un diario personal de gratitud. Está pensado para que tus entradas sigan siendo tuyas: la app no recoge datos personales. Lo único que puede salir de tu dispositivo es un informe de problema que tú decidas enviar.", "s": [["Qué recopilamos", "Nada por sí misma. La app no tiene cuenta, estadísticas, publicidad ni seguimiento, y tus entradas nunca salen de tu dispositivo. Funciona totalmente sin conexión."], ["Informes de problemas", "Si envías un informe desde Ajustes → Informar de un problema, recibimos solo lo que envías: el tipo y la sección, tu texto, una captura si la adjuntas y tu correo si lo escribes, junto con el idioma, la versión de la app y el modelo del teléfono (tamaño de pantalla y datos del navegador). Los informes nos llegan a través de los servicios de formularios Google Apps Script (Gmail) y solo se usan para responderte y mejorar la app. Para borrar un informe, escribe a mywondersinfo@gmail.com."], ["Qué se queda en tu dispositivo", "Tus notas, las fotos que adjuntas, tus ajustes y, si la defines, tu contraseña se guardan solo en el almacenamiento local de la app en tu dispositivo. La contraseña se guarda solo como un hash protegido, nunca como texto. La app abre tu galería solo cuando tú eliges una foto."], ["Compartir y copias de seguridad", "Cuando compartes una tarjeta, una película o un collage, o guardas una copia de seguridad, lo haces tú con las herramientas estándar de tu dispositivo. La app no envía nada por sí sola. El archivo de copia contiene tus notas y fotos: guárdalo en un lugar seguro."], ["Borrar tus datos", "Al borrar la app o sus datos se eliminan todas las notas de tu dispositivo. No tenemos ninguna copia y no podemos recuperarlas, así que guarda antes una copia de seguridad si la necesitas."], ["Niños", "La app es apta para todas las edades. No recoge datos por sí misma; un informe solo se envía si la persona lo escribe y pulsa Enviar."], ["Cambios", "Si esta política cambia, la nueva versión se publicará en esta página con una nueva fecha."], ["Contacto", "Preguntas sobre privacidad: mywondersinfo@gmail.com"]], "app": "Mis maravillas"}, "de": {"menu": "Datenschutz", "title": "Datenschutzerklärung", "upd": "Zuletzt aktualisiert: 17. Oktober 2026", "intro": "Meine Wunder ist ein persönliches Dankbarkeitstagebuch. Es ist so gebaut, dass deine Einträge bei dir bleiben: Die App sammelt keine persönlichen Daten. Dein Gerät verlassen kann nur eine Problemmeldung, die du selbst sendest.", "s": [["Was wir erheben", "Von sich aus nichts. Die App hat kein Konto, keine Analyse, keine Werbung und kein Tracking, und deine Einträge verlassen nie dein Gerät. Sie funktioniert vollständig offline."], ["Problemmeldungen", "Wenn du über Einstellungen → Problem melden eine Meldung sendest, erhalten wir nur, was du sendest: Art und Bereich, deinen Text, einen Screenshot, falls du ihn anhängst, und deine E-Mail, falls du sie angibst, dazu Sprache, App-Version und Telefonmodell (Bildschirmgröße und Browserangaben). Meldungen erreichen uns über die Formulardienste Google Apps Script (Gmail) und werden nur genutzt, um dir zu antworten und die App zu verbessern. Um eine Meldung löschen zu lassen, schreib an mywondersinfo@gmail.com."], ["Was auf deinem Gerät bleibt", "Deine Einträge, angehängte Fotos, deine Einstellungen und – falls du eins festlegst – dein Passwort werden nur im lokalen Speicher der App auf deinem Gerät gespeichert. Das Passwort wird nur als geschützter Hash abgelegt, nie im Klartext. Die App öffnet deine Fotos nur, wenn du selbst ein Foto auswählst."], ["Teilen und Sicherungen", "Wenn du eine Karte, einen Film oder eine Collage teilst oder eine Sicherung speicherst, tust du das selbst über die Standardfunktionen deines Geräts. Die App sendet nichts von sich aus. Eine Sicherungsdatei enthält deine Einträge und Fotos – bewahre sie sicher auf."], ["Daten löschen", "Wenn du die App löschst oder ihre Daten entfernst, werden alle Einträge von deinem Gerät gelöscht. Wir haben keine Kopie und können sie nicht wiederherstellen – erstelle bei Bedarf vorher eine Sicherung."], ["Kinder", "Die App ist für alle Altersgruppen geeignet. Sie sammelt von sich aus keine Daten; eine Meldung wird nur gesendet, wenn die Person sie schreibt und auf Senden tippt."], ["Änderungen", "Wenn sich diese Erklärung ändert, wird die neue Fassung mit neuem Datum auf dieser Seite veröffentlicht."], ["Kontakt", "Fragen zum Datenschutz: mywondersinfo@gmail.com"]], "app": "Meine Wunder"}, "it": {"menu": "Privacy", "title": "Informativa sulla privacy", "upd": "Ultimo aggiornamento: 17 ottobre 2026", "intro": "Le mie meraviglie è un diario personale di gratitudine. È pensato perché le tue voci restino tue: l’app non raccoglie dati personali. L’unica cosa che può lasciare il tuo dispositivo è una segnalazione di problema che decidi tu di inviare.", "s": [["Cosa raccogliamo", "Niente di sua iniziativa. L’app non ha account, statistiche, pubblicità né tracciamento, e le tue voci non lasciano mai il dispositivo. Funziona completamente offline."], ["Segnalazioni di problemi", "Se invii una segnalazione da Impostazioni → Segnala un problema, riceviamo solo ciò che invii: tipo e sezione, il tuo testo, uno screenshot se lo alleghi e la tua e-mail se la indichi, insieme a lingua, versione dell’app e modello del telefono (dimensioni dello schermo e dati del browser). Le segnalazioni ci arrivano tramite i servizi di moduli Google Apps Script (Gmail) e servono solo a risponderti e a migliorare l’app. Per far cancellare una segnalazione, scrivi a mywondersinfo@gmail.com."], ["Cosa resta sul tuo dispositivo", "Le tue note, le foto che alleghi, le impostazioni e, se la imposti, la password sono salvate solo nella memoria locale dell’app sul tuo dispositivo. La password è conservata solo come hash protetto, mai in chiaro. L’app apre la galleria solo quando scegli tu una foto."], ["Condivisione e backup", "Quando condividi una card, un film o un collage, o salvi un backup, lo fai tu con gli strumenti standard del dispositivo. L’app non invia nulla da sola. Il file di backup contiene le tue note e foto: conservalo in un posto sicuro."], ["Eliminare i dati", "Eliminando l’app o i suoi dati, tutte le note vengono cancellate dal dispositivo. Non ne abbiamo copia e non possiamo recuperarle: se serve, salva prima un backup."], ["Bambini", "L’app è adatta a tutte le età. Non raccoglie dati di sua iniziativa; una segnalazione viene inviata solo se la persona la scrive e tocca Invia."], ["Modifiche", "Se questa informativa cambia, la nuova versione sarà pubblicata su questa pagina con una nuova data."], ["Contatti", "Domande sulla privacy: mywondersinfo@gmail.com"]], "app": "Le mie meraviglie"}, "pt": {"menu": "Privacidade", "title": "Política de privacidade", "upd": "Última atualização: 17 de outubro de 2026", "intro": "Minhas maravilhas é um diário pessoal de gratidão. Foi feito para que seus registros fiquem com você: o app não coleta dados pessoais. A única coisa que pode sair do seu aparelho é um relato de problema que você decidir enviar.", "s": [["O que coletamos", "Nada por conta própria. O app não tem conta, estatísticas, publicidade nem rastreamento, e seus registros nunca saem do aparelho. Funciona totalmente offline."], ["Relatos de problemas", "Se você enviar um relato em Ajustes → Relatar um problema, recebemos só o que você envia: o tipo e a seção, seu texto, uma captura se você anexar e seu e-mail se você informar, além do idioma, da versão do app e do modelo do telefone (tamanho da tela e dados do navegador). Os relatos chegam até nós pelos serviços de formulários Google Apps Script (Gmail) e são usados apenas para responder a você e melhorar o app. Para apagar um relato, escreva para mywondersinfo@gmail.com."], ["O que fica no seu dispositivo", "Suas anotações, as fotos que você anexa, suas configurações e, se você definir, sua senha ficam guardadas apenas no armazenamento local do app no seu dispositivo. A senha é guardada só como um hash protegido, nunca como texto. O app só abre sua galeria quando você mesmo escolhe uma foto."], ["Compartilhamento e backup", "Quando você compartilha um card, um filme ou uma colagem, ou salva um backup, faz isso você mesmo pelas ferramentas padrão do dispositivo. O app não envia nada sozinho. O arquivo de backup contém suas anotações e fotos — guarde-o em um lugar seguro."], ["Excluir seus dados", "Ao excluir o app ou limpar os dados dele, todas as anotações são apagadas do dispositivo. Não temos cópia e não podemos recuperá-las; por isso, faça um backup antes, se precisar."], ["Crianças", "O app é adequado para todas as idades. Ele não coleta dados por conta própria; um relato só é enviado se a pessoa o escrever e tocar em Enviar."], ["Alterações", "Se esta política mudar, a nova versão será publicada nesta página com uma nova data."], ["Contato", "Dúvidas sobre privacidade: mywondersinfo@gmail.com"]], "app": "Minhas maravilhas"}, "tr": {"menu": "Gizlilik", "title": "Gizlilik Politikası", "upd": "Son güncelleme: 17 Ekim 2026", "intro": "Mucizelerim kişisel bir şükran günlüğüdür. Kayıtların sende kalsın diye tasarlandı: uygulama kişisel veri toplamaz. Cihazından çıkabilecek tek şey, göndermeye kendin karar verdiğin bir sorun bildirimidir.", "s": [["Ne topluyoruz", "Kendiliğinden hiçbir şey. Uygulamada hesap, analiz, reklam ve takip yoktur; kayıtların cihazından asla çıkmaz. Tamamen çevrimdışı çalışır."], ["Sorun bildirimleri", "Ayarlar → Sorun bildir üzerinden bildirim gönderirsen yalnızca gönderdiğini alırız: bildirim türü ve bölüm, metnin, eklersen ekran görüntüsü ve yazarsan e-postan; ayrıca uygulama dili, sürümü ve telefon modeli (ekran boyutu ve tarayıcı bilgisi). Bildirimler bize Google Apps Script (Gmail) form hizmetleri aracılığıyla ulaşır ve yalnızca sana yanıt vermek ve uygulamayı geliştirmek için kullanılır. Bir bildirimi sildirmek için mywondersinfo@gmail.com adresine yaz."], ["Cihazında ne kalır", "Kayıtların, eklediğin fotoğraflar, ayarların ve belirlersen şifren yalnızca cihazındaki uygulamanın yerel depolamasında saklanır. Şifre düz metin olarak değil, yalnızca korumalı bir özet (hash) olarak tutulur. Uygulama galerini yalnızca sen bir fotoğraf seçtiğinde açar."], ["Paylaşma ve yedekleme", "Bir kartı, filmi ya da kolajı paylaştığında veya yedek dosyası kaydettiğinde bunu cihazının standart paylaşma ya da kaydetme araçlarıyla kendin yaparsın. Uygulama kendiliğinden hiçbir şey göndermez. Yedek dosyası kayıtlarını ve fotoğraflarını içerir; onu güvenli bir yerde sakla."], ["Verilerini silmek", "Uygulamayı silmek ya da verilerini temizlemek tüm kayıtları cihazından kaldırır. Elimizde kopyası yoktur ve geri getiremeyiz; gerekirse önce bir yedek al."], ["Çocuklar", "Uygulama her yaşa uygundur. Kendiliğinden veri toplamaz; bir bildirim yalnızca kişi onu yazıp Gönder’e dokunduğunda gönderilir."], ["Değişiklikler", "Bu politika değişirse yeni sürüm yeni bir tarihle bu sayfada yayımlanır."], ["İletişim", "Gizlilikle ilgili sorular: mywondersinfo@gmail.com"]], "app": "Mucizelerim"}, "zh": {"menu": "隐私", "title": "隐私政策", "upd": "最后更新：2026年10月17日", "intro": "“我的奇迹”是一本私人感恩日记。它的设计让你的记录只属于你：应用不收集个人数据。唯一可能离开你设备的，是你自己决定发送的问题报告。", "s": [["我们收集什么", "应用本身不收集任何内容。没有账户、统计分析、广告或跟踪，你的记录永远不会离开设备。它可以完全离线使用。"], ["问题报告", "如果你通过“设置 → 报告问题”发送报告，我们只会收到你发送的内容：报告类型和所在部分、你的文字、你附上的截图、你填写的邮箱，以及应用语言、版本和手机型号（屏幕尺寸和浏览器信息）。报告通过表单服务 Google Apps Script (Gmail) 送达我们，仅用于回复你和改进应用。如需删除报告，请写信至 mywondersinfo@gmail.com。"], ["保存在你设备上的内容", "你的记录、附加的照片、设置以及你设置的密码，只保存在你设备上应用的本地存储中。密码只以受保护的哈希形式保存，绝不以明文保存。只有当你亲自选择照片时，应用才会打开相册。"], ["分享与备份", "当你分享卡片、影片或拼贴，或保存备份文件时，是你自己通过设备的标准分享或保存功能完成的。应用不会自行发送任何内容。备份文件包含你的记录和照片，请妥善保存。"], ["删除数据", "删除应用或清除其数据，会把所有记录从你的设备上移除。我们没有任何副本，也无法恢复，如有需要请先保存备份。"], ["儿童", "本应用适合所有年龄段。它本身不收集任何数据；只有当用户自己写下报告并点按“发送”时，报告才会被发送。"], ["变更", "如本政策有变更，新版本将连同新的日期发布在本页面。"], ["联系方式", "隐私相关问题：mywondersinfo@gmail.com"]], "app": "我的奇迹"}, "ja": {"menu": "プライバシー", "title": "プライバシーポリシー", "upd": "最終更新：2026年10月17日", "intro": "「わたしの奇跡」は個人のための感謝日記です。記録があなたの手元だけに残るよう作られており、アプリは個人データを収集しません。端末から送信されうるのは、あなた自身が送ると決めた問題の報告だけです。", "s": [["収集する情報", "アプリが自ら収集するものはありません。アカウント、分析、広告、トラッキングはなく、記録が端末の外に出ることはありません。完全にオフラインで動作します。"], ["問題の報告", "「設定 → 問題を報告」から報告を送ると、私たちが受け取るのはあなたが送った内容だけです：報告の種類と場所、本文、添付したスクリーンショット、入力したメールアドレス、そしてアプリの言語・バージョン・機種（画面サイズとブラウザ情報）。報告はフォームサービス Google Apps Script (Gmail) を通じて届き、返信とアプリの改善のためだけに使われます。報告の削除をご希望の場合は mywondersinfo@gmail.com までご連絡ください。"], ["端末に保存されるもの", "記録、添付した写真、設定、そして設定した場合はパスワードが、端末内のアプリのローカル保存領域にのみ保存されます。パスワードは保護されたハッシュとしてのみ保存され、平文では保存されません。写真ライブラリは、あなたが自分で写真を選ぶときにだけ開きます。"], ["共有とバックアップ", "カードやムービー、コラージュを共有したり、バックアップファイルを保存したりするときは、端末の標準の共有・保存機能を使ってあなた自身が行います。アプリが自動で何かを送信することはありません。バックアップファイルには記録と写真が含まれるため、安全な場所に保管してください。"], ["データの削除", "アプリを削除するか、アプリのデータを消去すると、すべての記録が端末から削除されます。こちらにコピーはなく復元もできないため、必要な場合は先にバックアップを保存してください。"], ["お子さまについて", "このアプリはすべての年齢の方に適しています。アプリが自らデータを収集することはなく、報告は本人が書いて「送信」を押したときだけ送られます。"], ["変更について", "本ポリシーを変更する場合は、新しい日付とともにこのページで公開します。"], ["お問い合わせ", "プライバシーに関するご質問：mywondersinfo@gmail.com"]], "app": "わたしの奇跡"}, "hi": {"menu": "गोपनीयता", "title": "गोपनीयता नीति", "upd": "अंतिम अपडेट: 17 अक्टूबर 2026", "intro": "“मेरे चमत्कार” एक निजी कृतज्ञता डायरी है। इसे इस तरह बनाया गया है कि आपकी प्रविष्टियाँ आपके पास ही रहें: ऐप कोई निजी डेटा इकट्ठा नहीं करता। आपके डिवाइस से केवल वही समस्या-रिपोर्ट बाहर जा सकती है जिसे आप खुद भेजना चुनें।", "s": [["हम क्या इकट्ठा करते हैं", "अपने-आप कुछ भी नहीं। ऐप में कोई खाता, एनालिटिक्स, विज्ञापन या ट्रैकिंग नहीं है, और आपकी प्रविष्टियाँ कभी डिवाइस से बाहर नहीं जातीं। यह पूरी तरह ऑफ़लाइन चलता है।"], ["समस्या-रिपोर्ट", "अगर आप सेटिंग्स → समस्या बताएँ से रिपोर्ट भेजते हैं, तो हमें केवल वही मिलता है जो आप भेजते हैं: रिपोर्ट का प्रकार और हिस्सा, आपका लिखा पाठ, जोड़ा गया स्क्रीनशॉट और दिया गया ईमेल, साथ ही ऐप की भाषा, संस्करण और फ़ोन मॉडल (स्क्रीन आकार और ब्राउज़र जानकारी)। रिपोर्ट हम तक फ़ॉर्म सेवाओं Google Apps Script (Gmail) के ज़रिए पहुँचती हैं और केवल आपको जवाब देने व ऐप सुधारने के लिए उपयोग होती हैं। रिपोर्ट हटवाने के लिए mywondersinfo@gmail.com पर लिखें।"], ["आपके डिवाइस पर क्या रहता है", "आपकी प्रविष्टियाँ, जोड़ी गई फ़ोटो, सेटिंग्स और अगर आप लगाएँ तो पासवर्ड — ये सब सिर्फ़ आपके डिवाइस पर ऐप के स्थानीय स्टोरेज में रहते हैं। पासवर्ड सादे पाठ में नहीं, सिर्फ़ सुरक्षित हैश के रूप में रखा जाता है। ऐप आपकी गैलरी तभी खोलता है जब आप ख़ुद कोई फ़ोटो चुनते हैं।"], ["साझा करना और बैकअप", "जब आप कोई कार्ड, फ़िल्म या कोलाज साझा करते हैं या बैकअप फ़ाइल सहेजते हैं, तो यह आप ख़ुद अपने डिवाइस के सामान्य साझा या सहेजने के विकल्पों से करते हैं। ऐप अपने आप कुछ नहीं भेजता। बैकअप फ़ाइल में आपकी प्रविष्टियाँ और फ़ोटो होते हैं — इसे सुरक्षित जगह पर रखें।"], ["अपना डेटा हटाना", "ऐप हटाने या उसका डेटा साफ़ करने से सभी प्रविष्टियाँ आपके डिवाइस से मिट जाती हैं। हमारे पास कोई प्रति नहीं होती और हम उन्हें वापस नहीं ला सकते, इसलिए ज़रूरत हो तो पहले बैकअप सहेज लें।"], ["बच्चे", "यह ऐप हर उम्र के लिए उपयुक्त है। यह अपने-आप कोई डेटा इकट्ठा नहीं करता; रिपोर्ट तभी जाती है जब व्यक्ति उसे लिखकर “भेजें” दबाए।"], ["बदलाव", "अगर यह नीति बदलती है, तो नया संस्करण नई तारीख के साथ इसी पेज पर प्रकाशित किया जाएगा।"], ["संपर्क", "गोपनीयता से जुड़े सवाल: mywondersinfo@gmail.com"]], "app": "मेरे चमत्कार"}, "el": {"menu": "Απόρρητο", "title": "Πολιτική απορρήτου", "upd": "Τελευταία ενημέρωση: 17 Οκτωβρίου 2026", "intro": "Το «Τα θαύματά μου» είναι ένα προσωπικό ημερολόγιο ευγνωμοσύνης. Είναι φτιαγμένο ώστε οι καταχωρίσεις σου να μένουν σε σένα: η εφαρμογή δεν συλλέγει προσωπικά δεδομένα. Το μόνο που μπορεί να φύγει από τη συσκευή σου είναι μια αναφορά προβλήματος που αποφασίζεις εσύ να στείλεις.", "s": [["Τι συλλέγουμε", "Τίποτα από μόνη της. Η εφαρμογή δεν έχει λογαριασμό, αναλύσεις, διαφημίσεις ή παρακολούθηση, και οι καταχωρίσεις σου δεν φεύγουν ποτέ από τη συσκευή. Λειτουργεί πλήρως εκτός σύνδεσης."], ["Αναφορές προβλημάτων", "Αν στείλεις αναφορά από Ρυθμίσεις → Αναφορά προβλήματος, λαμβάνουμε μόνο ό,τι στέλνεις: τον τύπο και την ενότητα, το κείμενό σου, στιγμιότυπο αν το επισυνάψεις και το email σου αν το δώσεις, μαζί με τη γλώσσα, την έκδοση της εφαρμογής και το μοντέλο τηλεφώνου (μέγεθος οθόνης και στοιχεία προγράμματος περιήγησης). Οι αναφορές φτάνουν σε εμάς μέσω των υπηρεσιών φορμών Google Apps Script (Gmail) και χρησιμοποιούνται μόνο για να σου απαντήσουμε και να βελτιώσουμε την εφαρμογή. Για διαγραφή μιας αναφοράς, γράψε στο mywondersinfo@gmail.com."], ["Τι μένει στη συσκευή σου", "Οι καταχωρίσεις σου, οι φωτογραφίες που επισυνάπτεις, οι ρυθμίσεις σου και, αν ορίσεις, ο κωδικός σου αποθηκεύονται μόνο στον τοπικό χώρο της εφαρμογής στη συσκευή σου. Ο κωδικός φυλάσσεται μόνο ως προστατευμένο κρυπτογραφικό αποτύπωμα, ποτέ ως απλό κείμενο. Η εφαρμογή ανοίγει τη συλλογή φωτογραφιών μόνο όταν επιλέγεις εσύ μια φωτογραφία."], ["Κοινοποίηση και αντίγραφα ασφαλείας", "Όταν μοιράζεσαι μια κάρτα, μια ταινία ή ένα κολάζ ή αποθηκεύεις αντίγραφο ασφαλείας, το κάνεις εσύ με τα τυπικά εργαλεία της συσκευής σου. Η εφαρμογή δεν στέλνει τίποτα μόνη της. Το αρχείο αντιγράφου περιέχει τις καταχωρίσεις και τις φωτογραφίες σου — φύλαξέ το σε ασφαλές μέρος."], ["Διαγραφή δεδομένων", "Η διαγραφή της εφαρμογής ή των δεδομένων της αφαιρεί όλες τις καταχωρίσεις από τη συσκευή σου. Δεν έχουμε αντίγραφο και δεν μπορούμε να τις επαναφέρουμε, γι’ αυτό αποθήκευσε πρώτα αντίγραφο αν το χρειάζεσαι."], ["Παιδιά", "Η εφαρμογή είναι κατάλληλη για όλες τις ηλικίες. Δεν συλλέγει δεδομένα από μόνη της· μια αναφορά στέλνεται μόνο όταν ο χρήστης τη γράψει και πατήσει Αποστολή."], ["Αλλαγές", "Αν αλλάξει αυτή η πολιτική, η νέα έκδοση θα δημοσιευτεί σε αυτή τη σελίδα με νέα ημερομηνία."], ["Επικοινωνία", "Ερωτήσεις για το απόρρητο: mywondersinfo@gmail.com"]], "app": "Τα θαύματά μου"}, "ar": {"menu": "الخصوصية", "title": "سياسة الخصوصية", "upd": "آخر تحديث: 17 أكتوبر 2026", "intro": "«أعاجيبي» دفتر شخصي للامتنان. صُمّم لتبقى مدوّناتك لك وحدك: لا يجمع التطبيق أي بيانات شخصية. الشيء الوحيد الذي قد يغادر جهازك هو بلاغ عن مشكلة تقرّر أنت إرساله.", "s": [["ما الذي نجمعه", "لا شيء من تلقاء نفسه. لا يوجد في التطبيق حساب ولا تحليلات ولا إعلانات ولا تتبّع، ولا تغادر مدوّناتك جهازك أبدًا. يعمل بالكامل دون اتصال بالإنترنت."], ["بلاغات المشكلات", "إذا أرسلت بلاغًا من الإعدادات ← الإبلاغ عن مشكلة، فإننا نتلقى ما ترسله فقط: نوع البلاغ والقسم، ونصّك، ولقطة الشاشة إن أرفقتها، وبريدك الإلكتروني إن كتبته، مع لغة التطبيق وإصداره وطراز الهاتف (حجم الشاشة ومعلومات المتصفح). تصلنا البلاغات عبر خدمتَي النماذج Google Apps Script (Gmail)، وتُستخدم فقط للرد عليك وتحسين التطبيق. لحذف بلاغ، راسلنا على mywondersinfo@gmail.com."], ["ما الذي يبقى على جهازك", "تُحفظ مدوّناتك والصور التي ترفقها وإعداداتك وكلمة المرور إن وضعتها في التخزين المحلي للتطبيق على جهازك فقط. تُحفظ كلمة المرور على شكل بصمة (hash) محمية فقط، وليس نصًا مقروءًا. لا يفتح التطبيق معرض الصور إلا عندما تختار صورة بنفسك."], ["المشاركة والنسخ الاحتياطي", "عندما تشارك بطاقة أو فيلمًا أو مجمّع صور، أو تحفظ نسخة احتياطية، فأنت تفعل ذلك بنفسك عبر أدوات المشاركة أو الحفظ المعتادة في جهازك. لا يرسل التطبيق أي شيء من تلقاء نفسه. يحتوي ملف النسخة الاحتياطية على مدوّناتك
